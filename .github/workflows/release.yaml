name: Release

concurrency:
  group: nativeaot-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and verify (e.g. v0.3.0). Must exist on remote."
        required: true

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve tag ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${TAG}"
            TAG="v${RAW#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Verify tag on remote (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.ref.outputs.tag }}" --silent --fail \
            || { echo "::error::Tag '${{ steps.ref.outputs.tag }}' does not exist on the remote. Push it first, then re-run."; exit 1; }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify version ↔ tag consistency
        id: version
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          TAG_VERSION="${TAG#v}"
          if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Directory.Build.props has '$PROPS_VERSION' but tag is '$TAG' (expected '$TAG_VERSION')"
            exit 1
          fi
          echo "version=${PROPS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Version check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${PROPS_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  # Linux files are built in containers at the package's libc floors (glibc 2.27, musl 1.2.3), each on a runner of
  # its own architecture; macOS files on the runner for macOS 12.0. The script fails a build that misses its floor.
  build-unix-native:
    needs: [verify]
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.tag }}
      - name: Build libminipty_unix
        shell: bash
        run: bash scripts/build-native-package.sh "${{ matrix.rid }}"
      - name: Upload native artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack NuGet
    needs: [verify, build-unix-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.tag }}
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: |
            10.0.x
      - name: Download native artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true
      - name: Pack with prebuilt native libraries
        shell: bash
        run: bash scripts/pack-with-native.sh "${{ needs.verify.outputs.version }}" ./publish
      - name: Upload NuGet packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nuget
          path: ./publish/
          retention-days: 1
          if-no-files-found: error

  nuget-smoke:
    name: NuGet smoke (${{ matrix.label }})
    needs: [verify, pack]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            label: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            label: windows-2025
            rid: win-x64
          - os: windows-11-arm
            label: windows-11-arm
            rid: win-arm64
          - os: macos-26
            label: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            label: macos-26-intel
            rid: osx-x64
          # The oldest macOS .NET 10 supports.
          - os: macos-15
            label: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            label: macos-15-intel
            rid: osx-x64
          # In containers: the oldest glibc .NET 10 supports (RHEL 8, glibc 2.28), and Alpine for the musl files.
          - os: ubuntu-24.04
            label: almalinux-8 x64
            rid: linux-x64
            image: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          - os: ubuntu-24.04-arm
            label: almalinux-8 arm64
            rid: linux-arm64
            image: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          - os: ubuntu-24.04
            label: alpine-3.21 x64
            rid: linux-musl-x64
            image: alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
          - os: ubuntu-24.04-arm
            label: alpine-3.21 arm64
            rid: linux-musl-arm64
            image: alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            samples
            scripts
      - if: ${{ !matrix.image }}
        uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
        with:
          dotnet-version: |
            10.0.x
      - name: Download NuGet packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nuget
          path: ./publish
      - name: Run NuGet smoke sample
        if: ${{ !matrix.image }}
        shell: bash
        run: bash scripts/run-nuget-smoke.sh "${{ needs.verify.outputs.version }}" ./publish "${{ matrix.rid }}"
      - name: Run NuGet smoke sample in a container
        if: ${{ matrix.image }}
        shell: bash
        run: bash scripts/run-nuget-smoke-in-container.sh "${{ needs.verify.outputs.version }}" ./publish "${{ matrix.rid }}" "${{ matrix.image }}" "${{ matrix.sdk-image }}"

  attest:
    name: Attest packages
    needs: [nuget-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nuget
          path: ./publish
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "./publish/*.nupkg"
      - name: Prepare SLSA attestation bundles for release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for nupkg in ./publish/*.nupkg; do
            gh attestation download "$nupkg" --repo "${GITHUB_REPOSITORY}"
            bundle=(sha256:*.jsonl)
            if [ "${#bundle[@]}" -ne 1 ]; then
              echo "::error::Expected one attestation bundle for $nupkg, found ${#bundle[@]}"
              exit 1
            fi
            mv "${bundle[0]}" "./publish/$(basename "$nupkg").sigstore.jsonl"
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nuget
          path: ./publish/
          retention-days: 1
          if-no-files-found: error

  create-release:
    if: ${{ github.event_name == 'push' }}
    needs: [verify, attest]
    permissions:
      contents: write
      id-token: write # for NuGet Trusted Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.SYNCED_NUGET_USER }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nuget
          path: ./artifacts/nuget
      - name: List Nuget
        run: ls -al ./artifacts/nuget
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name '*.nupkg' -o -name '*.sigstore.jsonl' \) -exec cp {} release/ \;
          if [ -z "$(find release/ -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No release assets found"
            exit 1
          fi
          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find release/ -maxdepth 1 -type f | sort | xargs -n 1 basename >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
      - run: dotnet nuget push "./release/*.nupkg" --skip-duplicate -s https://api.nuget.org/v3/index.json -k "${NUGET_KEY}"
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
