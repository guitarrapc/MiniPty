name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  MINIPTY_CI_PACKAGE_VERSION: 99.0.0-ci

jobs:
  build:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Build (JIT)
        shell: bash
        run: dotnet build -c Release
      - name: Test
        shell: bash
        run: dotnet test -c Release
      - name: Build libminipty_unix
        if: ${{ !startsWith(matrix.rid, 'win') }}
        shell: bash
        run: bash scripts/build-native.sh "${{ matrix.rid }}"

      - name: Publish and run samples (NativeAOT)
        shell: bash
        run: |
          for sample in Capture Session Observe Interactive ConsoleAttach WebTerminal VsCodeTerminalHelper VsCodePersistentBridge; do
            out="$RUNNER_TEMP/minipty-${sample}-aot"
            dotnet publish "samples/${sample}.cs" -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$out"
            exe="$out/${sample}"
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              exe="$out/${sample}.exe"
            fi
            test -f "$exe"
            if [[ "${{ matrix.rid }}" == linux-* ]]; then
              test ! -f "$out/libminipty_unix.so"
              test ! -f "$out/libminipty_unix.a"
            fi
            if [[ "${{ matrix.rid }}" == osx-* ]]; then
              test ! -f "$out/libminipty_unix.dylib"
              test ! -f "$out/libminipty_unix.a"
              test -f "$out/minipty_spawn_helper"
            fi
            if [[ "$sample" == WebTerminal || "$sample" == VsCodeTerminalHelper || "$sample" == VsCodePersistentBridge ]]; then
              "$exe" --smoke
            else
              "$exe"
            fi
          done

  build-unix-native:
    name: Native (${{ matrix.rid }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build libminipty_unix
        shell: bash
        run: bash scripts/build-native.sh "${{ matrix.rid }}"
      - name: Upload native artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack NuGet
    needs: [build-unix-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Download native artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true
      - name: Pack with prebuilt native libraries
        shell: bash
        run: bash scripts/pack-with-native.sh "${MINIPTY_CI_PACKAGE_VERSION}" ./publish
      - name: Upload NuGet packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nuget
          path: ./publish/
          retention-days: 1
          if-no-files-found: error

  nuget-smoke:
    name: NuGet smoke (${{ matrix.os }})
    needs: [pack]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            samples
            scripts
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Download NuGet packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nuget
          path: ./publish
      - name: Run NuGet smoke sample
        shell: bash
        run: bash scripts/run-nuget-smoke.sh "${MINIPTY_CI_PACKAGE_VERSION}" ./publish "${{ matrix.rid }}"

  build-complete:
    needs: [build, nuget-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: echo "Build, test, pack, and NuGet smoke completed successfully on all platforms."
