name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x
      - name: Build (JIT)
        shell: bash
        run: |
          dotnet build -c Release
      - name: Test
        shell: bash
        run: |
          dotnet test -c Release

  run:
    needs: [build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      # NativeAOT smoke: publish single-file sample and run the native binary
      - name: Publish and run Capture sample (NativeAOT)
        shell: bash
        run: |
          out="$RUNNER_TEMP/minipty-capture-aot"
          dotnet publish samples/Capture.cs -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$out"
          exe="$out/Capture"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            exe="$out/Capture.exe"
          fi
          test -f "$exe"
          "$exe"
