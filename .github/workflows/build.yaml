name: Build

concurrency:
  group: nativeaot-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  MINIPTY_CI_PACKAGE_VERSION: 99.0.0-ci

jobs:
  build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: windows-2022
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build (JIT)
        shell: bash
        run: dotnet build -c Release
      - name: Test
        shell: bash
        run: dotnet test -c Release
      # The NativeAOT samples below link this archive, so they link the one the package ships, built at its floors.
      - name: Build libminipty_unix
        if: ${{ !startsWith(matrix.rid, 'win') }}
        shell: bash
        run: bash scripts/build-native-package.sh "${{ matrix.rid }}"

      - name: Publish and run samples (NativeAOT)
        shell: bash
        run: |
          for sample in Capture Session Observe Interactive ConsoleAttach WebTerminal WebTerminalScale WebTerminalPtyHost VsCodeTerminalHelper VsCodePersistentBridge; do
            out="$RUNNER_TEMP/minipty-${sample}-aot"
            dotnet publish "samples/SingleFiles/${sample}.cs" -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$out"
            exe="$out/${sample}"
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              exe="$out/${sample}.exe"
            fi
            test -f "$exe"
            if [[ "${{ matrix.rid }}" == linux-* ]]; then
              test ! -f "$out/libminipty_unix.so"
              test ! -f "$out/libminipty_unix.a"
            fi
            if [[ "${{ matrix.rid }}" == osx-* ]]; then
              test ! -f "$out/libminipty_unix.dylib"
              test ! -f "$out/libminipty_unix.a"
              test -f "$out/minipty_spawn_helper"
            fi
            if [[ "$sample" == WebTerminal || "$sample" == WebTerminalScale || "$sample" == WebTerminalPtyHost || "$sample" == VsCodeTerminalHelper || "$sample" == VsCodePersistentBridge ]]; then
              "$exe" --smoke
            else
              "$exe"
            fi
          done

      - name: Publish and smoke-test the TUI sample (NativeAOT)
        if: ${{ matrix.os != 'windows-2022' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/minipty-tui-aot"
          dotnet publish samples/TuiDemo -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:StripSymbols=true -p:DebugType=None -o "$out"
          exe="$out/TuiDemo"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            exe="$out/TuiDemo.exe"
          fi
          "$exe" --smoke

      # The WinUI host sample is JIT-only (the Windows App SDK is its dependency, not MiniPty's) and runs here
      # in smoke mode: it spawns a shell on the UI thread, shows its output, and exits 0 once the output arrived.
      - name: Build and smoke-test the WinUI sample
        if: ${{ startsWith(matrix.rid, 'win') }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/minipty-winui"
          dotnet publish samples/WinUiTerminal/WinUiTerminal.csproj -c Release -r "${{ matrix.rid }}" -o "$out"
          "$out/WinUiTerminal.exe" --smoke

      # The Avalonia host sample is the same emulator on Windows, Linux, and macOS, JIT-only like the WinUI one.
      # Smoke mode needs a display: the Windows and macOS runners have one, Linux gets a virtual one from Xvfb.
      - name: Build and smoke-test the Avalonia sample
        shell: bash
        run: |
          out="$RUNNER_TEMP/minipty-avalonia"
          dotnet publish samples/AvaloniaTerminal/AvaloniaTerminal.csproj -c Release -r "${{ matrix.rid }}" -o "$out"
          exe="$out/AvaloniaTerminal"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            exe="$out/AvaloniaTerminal.exe"
          fi
          test -f "$exe"
          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb)
            xvfb-run -a "$exe" --smoke
          else
            "$exe" --smoke
          fi

  # The suite as a 32-bit process on x64 Windows. It is built self-contained, so the runner needs no 32-bit .NET, and
  # it covers the out-of-band ConPTY host a 32-bit conpty.dll needs on 64-bit Windows (platform_support.md).
  test-win-x86:
    name: Test (win-x86)
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the tests for win-x86
        shell: bash
        run: dotnet build tests/MiniPty.Tests/MiniPty.Tests.csproj -c Release -r win-x86 --self-contained --artifacts-path artifacts/x86
      - name: Test as a 32-bit process
        shell: bash
        run: artifacts/x86/bin/MiniPty.Tests/release_win-x86/MiniPty.Tests.exe

  # The suite as an x64 process on ARM64 Windows, under emulation. A win-x64 build stages the x64 OpenConsole.exe beside
  # the x64 conpty.dll (buildTransitive/MiniPty.ConPty.targets), so the out-of-band host runs emulated too; the build job
  # on windows-11-arm runs the suite as an arm64 process only. Built self-contained like test-win-x86's.
  test-win-x64-on-arm64:
    name: Test (win-x64 on arm64)
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the tests for win-x64
        shell: bash
        run: dotnet build tests/MiniPty.Tests/MiniPty.Tests.csproj -c Release -r win-x64 --self-contained --artifacts-path artifacts/x64
      - name: Test as an emulated x64 process
        shell: bash
        run: artifacts/x64/bin/MiniPty.Tests/release_win-x64/MiniPty.Tests.exe

  # musl has no hosted runner, so the suite runs once in an Alpine container, on x64, where the runner can run
  # JavaScript actions inside Alpine. The SDK image is pinned like every other image here (SDK 10.0.403 on Alpine
  # 3.24 when pinned). build-base compiles the shim; the tests' children need nothing beyond busybox.
  test-musl:
    name: Test (linux-musl-x64)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
    permissions:
      contents: read
    steps:
      - name: Install build tools
        run: apk add --no-cache bash build-base
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: dotnet test tests/MiniPty.Tests/MiniPty.Tests.csproj -c Release

  # CI's kernels have every call the Linux start uses, so its fallbacks for older kernels run only here: the suite runs
  # in a container under each seccomp profile in scripts/seccomp/, which make the kernel refuse the newer calls, after a
  # probe has checked every refusal. On x64, with glibc and with musl; the SDK images are pinned like test-musl's (SDK
  # 10.0.403 when pinned). What a filter cannot reproduce stays with scripts/old-kernel-qemu/, run by hand.
  test-old-kernel-paths:
    name: Test old-kernel paths (${{ matrix.libc }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          - libc: musl
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test under seccomp profiles
        shell: bash
        run: bash scripts/run-tests-under-seccomp.sh "${{ matrix.image }}"

  # FreeBSD has no hosted runner and the package ships no FreeBSD binary, so the shim is cross-compiled against the base
  # system of the oldest and the newest supported release, on both architectures.
  freebsd-native:
    name: FreeBSD compile (${{ matrix.release }}, ${{ matrix.arch }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        release: ["14.4", "15.1"]
        arch: [amd64, arm64]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/freebsd
            src/MiniPty/Native
      - name: Install clang and lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang lld
      - name: Compile the shim for FreeBSD
        shell: bash
        run: bash scripts/freebsd/compile-check.sh "${RELEASE}" "${ARCH}"
        env:
          RELEASE: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}

  # The suite in a FreeBSD 14.5 guest under QEMU, with KVM. .NET for FreeBSD is a community build of Microsoft's sources,
  # pinned by hash in the script.
  test-freebsd:
    name: Test FreeBSD (14.5 x64, QEMU)
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test in a FreeBSD guest
        shell: bash
        run: bash scripts/freebsd/run-tests-in-qemu.sh
        env:
          MINIPTY_QEMU_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e

  # Linux files are built in containers at the package's libc floors (glibc 2.27, musl 1.2.3), each on a runner of
  # its own architecture; macOS files on the runner for macOS 12.0. The script fails a build that misses its floor.
  build-unix-native:
    name: Native (${{ matrix.rid }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            rid: osx-x64
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build libminipty_unix
        shell: bash
        run: bash scripts/build-native-package.sh "${{ matrix.rid }}"
      - name: Upload native artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/
          retention-days: 1
          if-no-files-found: error

  pack:
    name: Pack NuGet
    needs: [build-unix-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download native artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true
      - name: Pack with prebuilt native libraries
        shell: bash
        run: bash scripts/pack-with-native.sh "${MINIPTY_CI_PACKAGE_VERSION}" ./publish
      - name: Upload NuGet packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nuget
          path: ./publish/
          retention-days: 1
          if-no-files-found: error

  nuget-smoke:
    name: NuGet smoke (${{ matrix.label }})
    needs: [pack]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            label: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            label: windows-2025
            rid: win-x64
          # The only hosted build without ReleasePseudoConsole (Server 2022, build 20348), for the in-box ConPTY.
          - os: windows-2022
            label: windows-2022
            rid: win-x64
          - os: windows-11-arm
            label: windows-11-arm
            rid: win-arm64
          - os: macos-26
            label: macos-26
            rid: osx-arm64
          - os: macos-26-intel
            label: macos-26-intel
            rid: osx-x64
          # The oldest macOS .NET 10 supports.
          - os: macos-15
            label: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            label: macos-15-intel
            rid: osx-x64
          # In containers: the oldest glibc .NET 10 supports (RHEL 8, glibc 2.28), and Alpine for the musl files.
          - os: ubuntu-24.04
            label: almalinux-8 x64
            rid: linux-x64
            image: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          - os: ubuntu-24.04-arm
            label: almalinux-8 arm64
            rid: linux-arm64
            image: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e
          - os: ubuntu-24.04
            label: alpine-3.21 x64
            rid: linux-musl-x64
            image: alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
          - os: ubuntu-24.04-arm
            label: alpine-3.21 arm64
            rid: linux-musl-arm64
            image: alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
            sdk-image: mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:cc02b814237a76c4735fb6eeee87181597b5e56f2ce458a435e527674d91f4d7
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            samples
            scripts
      - name: Set up .NET
        if: ${{ !matrix.image }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download NuGet packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nuget
          path: ./publish
      - name: Run NuGet smoke sample
        if: ${{ !matrix.image }}
        shell: bash
        run: bash scripts/run-nuget-smoke.sh "${MINIPTY_CI_PACKAGE_VERSION}" ./publish "${{ matrix.rid }}"
      - name: Run NuGet smoke sample in a container
        if: ${{ matrix.image }}
        shell: bash
        run: bash scripts/run-nuget-smoke-in-container.sh "${MINIPTY_CI_PACKAGE_VERSION}" ./publish "${{ matrix.rid }}" "${{ matrix.image }}" "${{ matrix.sdk-image }}"

  build-complete:
    needs:
      [
        build,
        test-win-x86,
        test-win-x64-on-arm64,
        test-musl,
        test-old-kernel-paths,
        freebsd-native,
        test-freebsd,
        nuget-smoke,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: echo "Build, test, pack, and NuGet smoke completed successfully on all platforms."
