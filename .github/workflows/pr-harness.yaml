name: PR Harness

on:
  pull_request:
    branches: [main]

jobs:
  harness:
    permissions:
      contents: read
      pull-requests: read
    uses: guitarrapc/actions/.github/workflows/pr-harness.yaml@c2e938426ab4b9ff4c08cedb0ad240181211f25a # v1.3.3
    with:
      allow-dependencies-licenses: "LicenseRef-github-OTHER,LicenseRef-scancode-unknown,LGPL-2.1-or-later,LicenseRef-scancode-ms-dxsdk-d3dx-9.29.952.3"
      exclude-license-input-paths: |
        samples/
        scripts/
