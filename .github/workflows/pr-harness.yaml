name: PR Harness

on:
  pull_request:
    branches: [main]

jobs:
  harness:
    permissions:
      contents: read
      pull-requests: read
    uses: guitarrapc/actions/.github/workflows/pr-harness.yaml@ecc29fa73a78e0061e4d686bf61c8eb23260ca49 # v1.3.4
    with:
      license-check: true
      allow-dependencies-licenses: "pkg:Microsoft.Graphics.Win2D,pkg:Microsoft.Windows.SDK.BuildTools,pkg:Microsoft.WindowsAppSDK"
      exclude-license-input-paths: |
        samples/
        scripts/
