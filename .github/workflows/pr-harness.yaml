name: PR Harness

on:
  pull_request:
    branches: [main]

jobs:
  harness:
    permissions:
      contents: read
      pull-requests: read
    uses: guitarrapc/actions/.github/workflows/pr-harness.yaml@74f3c78b2bcb7545e4c4911c5cf34124faecd2d2 # v1.3.2
    with:
      allow-dependencies-licenses: "LicenseRef-github-OTHER,LicenseRef-scancode-unknown,LGPL-2.1-or-later,LicenseRef-scancode-ms-dxsdk-d3dx-9.29.952.3"
      exclude-license-input-paths: "samples/,scripts/"
