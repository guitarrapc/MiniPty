name: PR Harness

on:
  pull_request:
    branches: [main]

jobs:
  harness:
    permissions:
      contents: read
      pull-requests: read
    uses: guitarrapc/actions/.github/workflows/pr-harness.yaml@ecc29fa73a78e0061e4d686bf61c8eb23260ca49 # v1.3.4
    with:
      license-check: true
      allow-dependencies-licenses: "LicenseRef-github-OTHER,LicenseRef-scancode-unknown,LGPL-2.1-or-later,LicenseRef-scancode-ms-dxsdk-d3dx-9.29.952.3"
      exclude-license-input-paths: |
        samples/
        scripts/
